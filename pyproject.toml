[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eqinox-nerve-center"
version = "1.3.0"
description = "Local-first tool routing and orchestration service"
requires-python = ">=3.11"
dependencies = ["cryptography>=42.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "black>=24.0.0", "flake8>=7.0.0", "isort>=5.13.0"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests", "tools"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.setuptools]
packages = ["core", "vault"]